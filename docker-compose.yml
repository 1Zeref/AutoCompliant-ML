services:
  traffic_assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_assistant_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Vietnam Motorbike Smart Traffic Assistant
      - APP_ENV=production
      - APP_PORT=8000
      - DEBUG=false
      - HOST=0.0.0.0
      - SECRET_KEY=${SECRET_KEY:-default-secret-key-32-chars-ok}
      - ALLOWED_ORIGINS=*
      - OSRM_SERVER_URL=https://router.project-osrm.org
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - traffic_net

networks:
  traffic_net:
    driver: bridge
