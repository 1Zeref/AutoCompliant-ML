version: '3.8'

services:
  # Web Dashboard Service (FastAPI Guided Stepper Wizard)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocompliant_web
    ports:
      - "8000:8000"
    command: python web_app.py --host 0.0.0.0 --port 8000
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./models/artifacts:/app/models/artifacts
      - ./configs:/app/configs
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  # Batch Optimization Job (NSGA-II + TOPSIS)
  optimizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocompliant_optimizer
    command: python run_optimization.py --config configs/bridge_amplifier.yaml
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./models/artifacts:/app/models/artifacts
      - ./configs:/app/configs
    profiles:
      - jobs
    environment:
      - PYTHONUNBUFFERED=1

  # Model Zoo Benchmarking Job (Cross-validation + Leaderboard)
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autocompliant_benchmark
    command: python run_benchmark.py --config configs/bridge_amplifier.yaml
    volumes:
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./models/artifacts:/app/models/artifacts
      - ./configs:/app/configs
    profiles:
      - jobs
    environment:
      - PYTHONUNBUFFERED=1
