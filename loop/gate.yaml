version: 1
project: "AutoCompliant-ML"

safety_gates:
  - name: "unit_tests"
    description: "Tất cả các unit tests hiện hành phải pass 100%"
    command: "pytest tests/ -v"
    fail_on_error: true

  - name: "config_validation_check"
    description: "Đảm bảo các file YAML cấu hình trong configs/ hợp lệ"
    command: "python -c \"from autocompliant.config.loader import load_topology_config; load_topology_config('configs/bridge_amplifier.yaml')\""
    fail_on_error: true

  - name: "leakage_and_shape_check"
    description: "Kiểm tra shape tensor và tính độc lập Train/Test"
    command: "pytest tests/test_data.py -k test_no_data_leakage"
    fail_on_error: true

  - name: "surrogate_r2_floor"
    description: "Đảm bảo mô hình đạt độ chính xác tối thiểu trên dữ liệu benchmark"
    command: "pytest tests/test_models.py -k test_model_r2_score"
    fail_on_error: true

  - name: "web_ui_gate"
    description: "Kiểm tra tính toàn vẹn của WebUI và API endpoint"
    command: "pytest tests/test_web.py -v"
    fail_on_error: true

# Static Path Safety Policy (Hỗ trợ loop-gate CLI)
denylist:
  - ".env*"
  - "**/secrets/**"
  - "auth/**"
  - "**/*.pem"
  - "**/*.key"
  - ".git/**"

maxFiles: 5

autoMergeAllowlist:
  - "docs/**"
  - "**/*.md"
  - "STATE.md"
  - "loop-run-log.md"
